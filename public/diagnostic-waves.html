<!DOCTYPE html>
<html>
<head>
    <title>Wave Diagnostic Tool</title>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Your Firebase config (same as in your app)
        const firebaseConfig = {
            apiKey: "AIzaSyBE-YcNr2OcqOIl7z56xyJXE9WU_fv0PYM",
            authDomain: "wave-tracker-exos.firebaseapp.com",
            projectId: "wave-tracker-exos",
            storageBucket: "wave-tracker-exos.firebasestorage.app",
            messagingSenderId: "502899068851",
            appId: "1:502899068851:web:cf49296aed67d18c2c5e83"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function diagnoseWaves() {
            const output = document.getElementById('output');
            output.innerHTML = '<p>🔍 Loading waves from Firebase...</p>';

            try {
                const wavesCol = collection(db, 'waves');
                const wavesSnap = await getDocs(wavesCol);
                
                output.innerHTML = `<h2>Found ${wavesSnap.docs.length} waves in Firebase:</h2>`;
                
                const wavesList = [];
                for (const waveDoc of wavesSnap.docs) {
                    const waveData = waveDoc.data();
                    
                    // Load participants
                    const participantsCol = collection(waveDoc.ref, 'participants');
                    const partsSnap = await getDocs(participantsCol);
                    
                    wavesList.push({
                        id: waveDoc.id,
                        name: waveData.name,
                        startTime: waveData.startTime,
                        participantCount: partsSnap.docs.length,
                        participants: partsSnap.docs.map(d => ({
                            id: d.id,
                            name: d.data().name
                        }))
                    });
                }

                // Sort by wave number
                wavesList.sort((a, b) => {
                    const matchA = a.name.match(/Wave (\d+)/);
                    const matchB = b.name.match(/Wave (\d+)/);
                    const numA = matchA ? parseInt(matchA[1]) : 0;
                    const numB = matchB ? parseInt(matchB[1]) : 0;
                    return numA - numB;
                });

                let html = '<table border="1" cellpadding="10" style="border-collapse: collapse; width: 100%;">';
                html += '<tr><th>Wave ID</th><th>Wave Name</th><th>Start Time</th><th>Participants</th><th>Actions</th></tr>';
                
                for (const wave of wavesList) {
                    html += `<tr>
                        <td><code>${wave.id}</code></td>
                        <td><strong>${wave.name}</strong></td>
                        <td>${wave.startTime || '<em>Not set</em>'}</td>
                        <td>${wave.participantCount} participants
                            ${wave.participants.length > 0 ? '<br><small>' + wave.participants.map(p => p.name).join(', ') + '</small>' : ''}
                        </td>
                        <td><button onclick="deleteWave('${wave.id}', '${wave.name}')">🗑️ Delete</button></td>
                    </tr>`;
                }
                
                html += '</table>';
                output.innerHTML += html;

                // Check for duplicates
                const nameCount = {};
                wavesList.forEach(w => {
                    nameCount[w.name] = (nameCount[w.name] || 0) + 1;
                });
                
                const duplicates = Object.keys(nameCount).filter(name => nameCount[name] > 1);
                if (duplicates.length > 0) {
                    output.innerHTML += `<h3 style="color: red;">⚠️ Found duplicate wave names:</h3>`;
                    output.innerHTML += `<ul>${duplicates.map(name => `<li>${name} appears ${nameCount[name]} times</li>`).join('')}</ul>`;
                }

            } catch (error) {
                output.innerHTML += `<p style="color: red;">❌ Error: ${error.message}</p>`;
                console.error(error);
            }
        }

        window.deleteWave = async function(waveId, waveName) {
            if (!confirm(`Are you sure you want to delete ${waveName} (${waveId})?`)) {
                return;
            }

            try {
                const waveRef = doc(db, 'waves', waveId);
                
                // Delete participants first
                const participantsCol = collection(waveRef, 'participants');
                const partsSnap = await getDocs(participantsCol);
                for (const partDoc of partsSnap.docs) {
                    await deleteDoc(partDoc.ref);
                }
                
                // Delete wave
                await deleteDoc(waveRef);
                
                alert(`✅ Deleted ${waveName}`);
                diagnoseWaves(); // Refresh
            } catch (error) {
                alert(`❌ Error deleting wave: ${error.message}`);
            }
        };

        // Auto-run on load
        window.addEventListener('load', diagnoseWaves);
        window.diagnoseWaves = diagnoseWaves;
    </script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        button {
            padding: 5px 10px;
            cursor: pointer;
        }
        table {
            margin-top: 20px;
        }
        th {
            background-color: #f0f0f0;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>🔍 Wave Diagnostic Tool</h1>
    <p>This tool shows all waves currently in your Firebase database.</p>
    <button onclick="diagnoseWaves()">🔄 Refresh</button>
    <div id="output"></div>
</body>
</html>
