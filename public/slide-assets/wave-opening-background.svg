  <rect x="1340" y="350" width="106" height="50" rx="10" fill="#2563EB"/>
  <text x="1393" y="382" text-anchor="middle" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Open Sheet</text>

  <rect x="464" y="448" width="992" height="470" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2"/>

  <rect x="500" y="484" width="214" height="158" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
